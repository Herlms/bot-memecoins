name: Bot memecoins (simulação)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-memecoins
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Correr um ciclo do bot
        run: python3 bot.py ciclo

      - name: Guardar estado no repositório
        run: |
          git config user.name "bot-memecoins"
          git config user.email "bot-memecoins@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ciclo $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
